services:
  - type: web
    name: pathpilot-ai-ndl-api
    runtime: node
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm run typecheck && corepack pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false

  - type: web
    name: pathpilot-ai-ndl
    runtime: static
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm run typecheck && PORT=10000 BASE_PATH=/ corepack pnpm --filter @workspace/pathpilot-ai run build
    staticPublishPath: artifacts/pathpilot-ai/dist/public
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
    routes:
      - type: rewrite
        source: /api
        destination: https://pathpilot-ai-ndl-api.onrender.com/api
      - type: rewrite
        source: /api/*
        destination: https://pathpilot-ai-ndl-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
